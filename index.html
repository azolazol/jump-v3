<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>또유니의 일상 극복 2단 점프</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #f1f2f6; overflow: hidden; touch-action: none; font-family: 'Malgun Gothic', sans-serif; }
        
        /* 캔버스 래퍼 (UI를 캔버스 위에 겹치기 위함) */
        #gameContainer { position: relative; max-width: 100%; }
        canvas { background-color: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; display: block; outline: none; max-width: 100%; height: auto; }
        
        /* 🎮 게임 오버 및 랭킹 UI 스타일 */
        #gameOverUI {
            display: none; /* 평소엔 숨김 */
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
        }
        #gameOverUI h2 { color: #ff4757; margin-bottom: 5px; }
        #finalScore { font-size: 24px; font-weight: bold; color: #2f3542; margin-bottom: 20px; }
        
        .input-group { margin-bottom: 15px; }
        #nickname { padding: 10px; font-size: 16px; border: 2px solid #dfe4ea; border-radius: 5px; width: 180px; text-align: center; }
        
        .btn { padding: 10px 20px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; margin: 5px; }
        .btn-submit { background-color: #2ed573; color: white; }
        .btn-submit:active { background-color: #26ae60; }
        .btn-restart { background-color: #747d8c; color: white; }
        .btn-restart:active { background-color: #57606f; }
        
        #rankingBoard { margin-top: 20px; background: #f8a5c2; padding: 10px 20px; border-radius: 10px; min-width: 200px; color: #fff;}
        #rankingBoard h3 { margin: 0 0 10px 0; font-size: 18px; }
        #rankingList { list-style: none; padding: 0; margin: 0; text-align: left; font-size: 16px; font-weight: bold; }
        #rankingList li { margin-bottom: 5px; display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.5); padding-bottom: 3px; }
        
        p.guide { color: #2f3542; margin-top: 20px; text-align: center; padding: 0 10px; }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="400" tabindex="0"></canvas>
    
    <!-- 게임 오버 시 나타나는 랭킹 UI -->
    <div id="gameOverUI">
        <h2>시련에 굴복했습니다!</h2>
        <div id="finalScore">점수: 0</div>
        
        <div class="input-group">
            <input type="text" id="nickname" placeholder="닉네임 입력" maxlength="8">
        </div>
        <div>
            <button class="btn btn-submit" onclick="submitRanking()">랭킹 등록</button>
            <button class="btn btn-restart" onclick="restartGame()">그냥 다시하기</button>
        </div>
        
        <div id="rankingBoard">
            <h3>🏆 명예의 전당 (Top 5) 🏆</h3>
            <ul id="rankingList">
                <!-- 랭킹 데이터가 여기에 표시됩니다 -->
            </ul>
        </div>
    </div>
</div>

<p class="guide">스페이스바, 위쪽 화살표(↑), 마우스 클릭 또는 화면 터치로 점프하세요!</p>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('gameOverUI');
const scoreText = document.getElementById('finalScore');
const nicknameInput = document.getElementById('nickname');
const rankingList = document.getElementById('rankingList');
canvas.focus();

const playerImg = new Image();
playerImg.src = 'player.png'; 
let imageLoaded = false;
playerImg.onload = () => { imageLoaded = true; };

let animationId;
let frames = 0;
let score = 0;
let gameOver = false;
let gameSpeed = 6;

const player = {
    x: 50, y: 300, w: 55, h: 70, vy: 0, gravity: 0.6, jumpForce: -11, jumpCount: 0, maxJumps: 2, 
    draw() {
        if (imageLoaded) {
            ctx.drawImage(playerImg, this.x, this.y, this.w, this.h);
        } else {
            ctx.fillStyle = '#ff4757'; ctx.fillRect(this.x, this.y, this.w, this.h);
        }
    },
    update() {
        this.vy += this.gravity;
        this.y += this.vy;
        if (this.y + this.h >= canvas.height) {
            this.y = canvas.height - this.h; this.vy = 0; this.jumpCount = 0; 
        }
    },
    jump() {
        if (this.jumpCount < this.maxJumps) {
            this.vy = this.jumpForce; this.jumpCount++;
        }
    }
};

const wordList = ['학원', '숙제', '학교', '잠', '놀기', '잔소리', '수행평가', '과학 숙제', '양치하기', '방 정리', '스마트폰'];
const obstacles = [];

class Obstacle {
    constructor() {
        this.text = wordList[Math.floor(Math.random() * wordList.length)];
        ctx.font = 'bold 26px "Malgun Gothic"';
        this.w = ctx.measureText(this.text).width;
        this.h = 30; 
        this.x = canvas.width;
        this.y = canvas.height - this.h - (Math.random() * 20); 
        this.floatOffset = Math.random() * 100; 
    }
    draw() {
        const floatY = Math.sin((frames + this.floatOffset) * 0.1) * 5; 
        ctx.fillStyle = '#e84118'; ctx.font = 'bold 26px "Malgun Gothic"'; ctx.textAlign = 'left';
        ctx.fillText(this.text, this.x, this.y + 24 + floatY); 
    }
    update() { this.x -= gameSpeed; }
}

function handleObstacles() {
    if (frames % 90 === 0) obstacles.push(new Obstacle());
    for (let i = 0; i < obstacles.length; i++) {
        let obs = obstacles[i];
        obs.update(); obs.draw();
        
        if (player.x < obs.x + obs.w - 5 && player.x + player.w - 10 > obs.x && player.y < obs.y + obs.h - 5 && player.y + player.h - 10 > obs.y) {
            gameOver = true;
        }
        
        if (obs.x + obs.w < 0) { obstacles.splice(i, 1); score++; i--; }
    }
}

// 🏆 랭킹 시스템 로직
function loadRankings() {
    // 로컬 스토리지에서 랭킹 데이터를 가져옵니다.
    const ranks = JSON.parse(localStorage.getItem('jumpGameRanks')) || [];
    rankingList.innerHTML = '';
    if (ranks.length === 0) {
        rankingList.innerHTML = '<li>아직 등록된 랭킹이 없습니다!</li>';
        return;
    }
    // 최대 5등까지 화면에 출력
    ranks.slice(0, 5).forEach((rank, index) => {
        rankingList.innerHTML += `<li><span>${index + 1}. ${rank.name}</span> <span>${rank.score}점</span></li>`;
    });
}

function submitRanking() {
    let name = nicknameInput.value.trim();
    if (!name) name = '무명 극복자'; // 이름 미입력 시 기본값
    
    let ranks = JSON.parse(localStorage.getItem('jumpGameRanks')) || [];
    ranks.push({ name: name, score: score });
    
    // 점수가 높은 순으로 정렬
    ranks.sort((a, b) => b.score - a.score);
    
    // 로컬 스토리지에 저장
    localStorage.setItem('jumpGameRanks', JSON.stringify(ranks));
    
    nicknameInput.value = ''; // 입력창 비우기
    restartGame(); // 등록 후 게임 재시작
}

// 조작 관련 (게임 오버 상태일 때는 점프를 막아 글자 입력 중 화면이 넘어가지 않게 함)
function handleJump() {
    if (gameOver) return; 
    player.jump();
}

let spacePressed = false;
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32 || e.key === 'ArrowUp') {
        if (!gameOver) e.preventDefault(); 
        if (!spacePressed) { handleJump(); spacePressed = true; }
    }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32 || e.key === 'ArrowUp') spacePressed = false;
});
canvas.addEventListener('touchstart', (e) => {
    if (!gameOver) { e.preventDefault(); handleJump(); }
}, { passive: false });
canvas.addEventListener('mousedown', () => { if (!gameOver) handleJump(); });

function showGameOverUI() {
    ui.style.display = 'flex';
    scoreText.innerText = `극복 점수: ${score}점`;
    loadRankings();
}

function restartGame() {
    ui.style.display = 'none';
    gameOver = false; score = 0; frames = 0; obstacles.length = 0;
    player.y = canvas.height - player.h; player.vy = 0;
    canvas.focus(); // 캔버스로 다시 포커스 맞추기
    animate();
}

function animate() {
    if (gameOver) {
        showGameOverUI();
        return; // 애니메이션 루프 완전 정지
    }
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    player.update();
    player.draw();
    handleObstacles();
    
    ctx.fillStyle = '#2f3542'; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'left';
    ctx.fillText(`점수: ${score}`, 20, 40);
    
    frames++;
    animationId = requestAnimationFrame(animate);
}

// 첫 시작
animate();
</script>
</body>
</html>
