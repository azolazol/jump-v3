<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2단 점프 게임</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #f1f2f6; overflow: hidden; touch-action: none; }
        canvas { background-color: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; max-width: 100%; height: auto; outline: none; }
        p { font-family: 'Malgun Gothic', sans-serif; color: #2f3542; margin-top: 20px; text-align: center; padding: 0 10px; }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="400" tabindex="0"></canvas>
<p>스페이스바, 위쪽 화살표(↑), 마우스 클릭 또는 화면 터치로 점프하세요!</p>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.focus();

const playerImg = new Image();
playerImg.src = 'player.png'; 
let imageLoaded = false;
playerImg.onload = () => { imageLoaded = true; };

let animationId;
let frames = 0;
let score = 0;
let gameOver = false;
let gameSpeed = 6;

const player = {
    x: 50, y: 300, w: 55, h: 70, vy: 0, gravity: 0.6, jumpForce: -11, jumpCount: 0, maxJumps: 2, 
    
    draw() {
        if (imageLoaded) {
            ctx.drawImage(playerImg, this.x, this.y, this.w, this.h);
        } else {
            ctx.fillStyle = '#ff4757';
            ctx.fillRect(this.x, this.y, this.w, this.h);
        }
    },
    
    update() {
        this.vy += this.gravity;
        this.y += this.vy;
        if (this.y + this.h >= canvas.height) {
            this.y = canvas.height - this.h;
            this.vy = 0;
            this.jumpCount = 0; 
        }
    },
    
    jump() {
        if (this.jumpCount < this.maxJumps) {
            this.vy = this.jumpForce;
            this.jumpCount++;
        }
    }
};

// 🔥 장애물로 사용할 단어 목록입니다! 원하시는 단어를 마음껏 추가/수정하세요.
const wordList = [
    '학원', '숙제', '학교', '잠', '놀기', '잔소리', 
    '수행평가', '과학 숙제', '양치하기', '방 정리', '스마트폰'
];

const obstacles = [];
class Obstacle {
    constructor() {
        // 단어 목록에서 랜덤으로 하나 뽑기
        this.text = wordList[Math.floor(Math.random() * wordList.length)];
        
        // 글자 크기에 맞춰 충돌 범위(너비) 계산
        ctx.font = 'bold 26px "Malgun Gothic"';
        this.w = ctx.measureText(this.text).width;
        this.h = 30; // 충돌 범위(높이)
        
        this.x = canvas.width;
        // 바닥에서부터 약간씩 다른 높이로 생성되도록 랜덤 값 추가
        this.y = canvas.height - this.h - (Math.random() * 20); 
        
        // 둥둥 떠다니는 효과를 위한 고유 타이머(오프셋)
        this.floatOffset = Math.random() * 100; 
    }
    
    draw() {
        // 수학 사인(sin) 곡선을 이용해 위아래로 부드럽게 둥둥 떠다니는 효과 계산 (-5px ~ +5px)
        const floatY = Math.sin((frames + this.floatOffset) * 0.1) * 5; 
        
        ctx.fillStyle = '#e84118'; // 글자 색상 (눈에 띄는 빨간 계열)
        ctx.font = 'bold 26px "Malgun Gothic"';
        ctx.textAlign = 'left';
        
        // y좌표에 floatY를 더해서 그려줍니다
        ctx.fillText(this.text, this.x, this.y + 24 + floatY); 
    }
    
    update() {
        this.x -= gameSpeed;
    }
}

function handleObstacles() {
    // 90 프레임마다 장애물(단어) 생성
    if (frames % 90 === 0) obstacles.push(new Obstacle());
    
    for (let i = 0; i < obstacles.length; i++) {
        let obs = obstacles[i];
        obs.update();
        obs.draw();
        
        // 글자는 여백이 많으므로 충돌 범위를 살짝 관대하게(-5, -10) 조정
        if (
            player.x < obs.x + obs.w - 5 && 
            player.x + player.w - 10 > obs.x && 
            player.y < obs.y + obs.h - 5 && 
            player.y + player.h - 10 > obs.y
        ) {
            gameOver = true;
        }
        
        if (obs.x + obs.w < 0) {
            obstacles.splice(i, 1); score++; i--; 
        }
    }
}

function handleJump() {
    if (gameOver) restartGame();
    else player.jump();
}

let spacePressed = false;
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32 || e.key === 'ArrowUp') {
        e.preventDefault(); 
        if (!spacePressed) { handleJump(); spacePressed = true; }
    }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32 || e.key === 'ArrowUp') {
        spacePressed = false;
    }
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault(); handleJump();
}, { passive: false });
canvas.addEventListener('mousedown', () => handleJump());

function restartGame() {
    gameOver = false; score = 0; frames = 0; obstacles.length = 0;
    player.y = canvas.height - player.h; player.vy = 0;
    animate();
}

function animate() {
    if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white'; ctx.font = '30px Arial'; ctx.textAlign = 'center';
        ctx.fillText('시련에 굴복했습니다! 터치하여 재도전!', canvas.width / 2, canvas.height / 2);
        return;
    }
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    player.update();
    player.draw();
    handleObstacles();
    
    ctx.fillStyle = '#2f3542'; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'left';
    ctx.fillText(`극복 점수: ${score}`, 20, 40);
    
    frames++;
    animationId = requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
