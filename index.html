<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>또유니의 일상 극복 2단 점프</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #f1f2f6; overflow: hidden; touch-action: none; font-family: 'Malgun Gothic', sans-serif; }
        #gameContainer { position: relative; max-width: 100%; }
        canvas { background-color: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; display: block; outline: none; max-width: 100%; height: auto; }
        
        #gameOverUI {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.95); border-radius: 8px;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        #gameOverUI h2 { color: #ff4757; margin-bottom: 5px; }
        #finalScore { font-size: 24px; font-weight: bold; color: #2f3542; margin-bottom: 20px; }
        
        .input-group { margin-bottom: 15px; }
        #nickname { padding: 10px; font-size: 16px; border: 2px solid #dfe4ea; border-radius: 5px; width: 180px; text-align: center; }
        
        .btn { padding: 10px 20px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; margin: 5px; }
        .btn-submit { background-color: #2ed573; color: white; }
        .btn-submit:disabled { background-color: #a4b0be; cursor: not-allowed; }
        .btn-restart { background-color: #747d8c; color: white; }
        
        #rankingBoard { margin-top: 20px; background: #f8a5c2; padding: 10px 20px; border-radius: 10px; min-width: 250px; color: #fff;}
        #rankingBoard h3 { margin: 0 0 10px 0; font-size: 18px; }
        #rankingList { list-style: none; padding: 0; margin: 0; text-align: left; font-size: 16px; font-weight: bold; }
        #rankingList li { margin-bottom: 5px; display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.5); padding-bottom: 3px; }
        
        p.guide { color: #2f3542; margin-top: 20px; text-align: center; padding: 0 10px; }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="400" tabindex="0"></canvas>
    
    <div id="gameOverUI">
        <h2>시련에 굴복했습니다!</h2>
        <div id="finalScore">점수: 0 / 골드: 0G</div>
        
        <div class="input-group">
            <input type="text" id="nickname" placeholder="닉네임 입력" maxlength="8">
        </div>
        <div>
            <button class="btn btn-submit" onclick="submitRanking()">랭킹 등록</button>
            <button class="btn btn-restart" onclick="restartGame()">그냥 다시하기</button>
        </div>
        
        <div id="rankingBoard">
            <h3>🏆 글로벌 명예의 전당 (Top 5) 🏆</h3>
            <ul id="rankingList"></ul>
        </div>
    </div>
</div>

<p class="guide">스페이스바, 화살표(↑), 마우스, 터치로 점프! 공중의 보상을 획득하세요!</p>

<script>
// =========================================================================
// 🔥 [매우 중요] 아래 따옴표 안에 아까 복사하신 구글 웹 앱 URL을 붙여넣으세요!!
// =========================================================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxLl0lOmCOm0sGtoPPNGOJe3eSaREiaeJaO39G_nP_IS9jBvW1C8i4shjkeXR1e2oPl/exec';


const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('gameOverUI');
const scoreText = document.getElementById('finalScore');
const nicknameInput = document.getElementById('nickname');
const rankingList = document.getElementById('rankingList');
canvas.focus();

const playerImg = new Image();
playerImg.src = 'player.png'; 
let imageLoaded = false;
playerImg.onload = () => { imageLoaded = true; };

let animationId;
let frames = 0;
let score = 0;
let gold = 0; 
let gameOver = false;
let gameSpeed = 6;

const player = {
    x: 50, y: 300, w: 55, h: 70, vy: 0, gravity: 0.6, jumpForce: -11, jumpCount: 0, maxJumps: 2, 
    draw() {
        if (imageLoaded) ctx.drawImage(playerImg, this.x, this.y, this.w, this.h);
        else { ctx.fillStyle = '#ff4757'; ctx.fillRect(this.x, this.y, this.w, this.h); }
    },
    update() {
        this.vy += this.gravity;
        this.y += this.vy;
        if (this.y + this.h >= canvas.height) {
            this.y = canvas.height - this.h; this.vy = 0; this.jumpCount = 0; 
        }
    },
    jump() {
        if (this.jumpCount < this.maxJumps) {
            this.vy = this.jumpForce; this.jumpCount++;
        }
    }
};

const wordList = [
    '학원', '숙제', '학교', '잠', '놀기', '잔소리', '수행평가', '과학 숙제', '양치하기', '방 정리', '스마트폰', '책상정리',
    '일어나기', '밥먹기', '숙제하기', '학교가기', '학원가기', '책읽어', '가방챙기기', '운동하기',
    '수학 문제', '영어 단어', '오답 노트', '일기 쓰기',
    '심부름', '일찍 자기', '씻고 자라', '채소 먹기', '제때 먹기', '목욕하기', '손씻기', '뒹구르기', '화내기', '승질내기',
    '폰 압수', '게임 꺼라', 'TV 그만', '자세 똑바로', '유튭끄기'
];

const rewardList = [
    '폭풍 칭찬', '수학 1up', '과학 1up', '국어 1up', '자존감 1up', '체력 1up', 
    '인내심 1up', '게임시간 +30분', '용돈 보너스', '새 자전거 획득!', 
    '아빠의 특급 칭찬', '자유시간', '치킨 파티', '주말 늦잠 찬스'
];

const obstacles = [];
const rewards = []; 

class Obstacle {
    constructor() {
        this.text = wordList[Math.floor(Math.random() * wordList.length)];
        ctx.font = 'bold 26px "Malgun Gothic"';
        this.w = ctx.measureText(this.text).width;
        this.h = 30; 
        this.x = canvas.width;
        this.y = canvas.height - this.h - (Math.random() * 20); 
        this.floatOffset = Math.random() * 100; 
    }
    draw() {
        const floatY = Math.sin((frames + this.floatOffset) * 0.1) * 5; 
        ctx.fillStyle = '#e84118'; 
        ctx.font = 'bold 26px "Malgun Gothic"'; ctx.textAlign = 'left';
        ctx.fillText(this.text, this.x, this.y + 24 + floatY); 
    }
    update() { this.x -= gameSpeed; }
}

class Reward {
    constructor() {
        this.text = rewardList[Math.floor(Math.random() * rewardList.length)];
        ctx.font = 'bold 22px "Malgun Gothic"';
        this.w = ctx.measureText(this.text).width;
        this.h = 30; 
        this.x = canvas.width;
        this.y = canvas.height - 130 - (Math.random() * 50); 
        this.floatOffset = Math.random() * 100; 
    }
    draw() {
        const floatY = Math.sin((frames + this.floatOffset) * 0.15) * 8; 
        ctx.fillStyle = '#f39c12'; 
        ctx.font = 'bold 22px "Malgun Gothic"'; ctx.textAlign = 'left';
        ctx.shadowColor = 'rgba(241, 196, 15, 0.8)';
        ctx.shadowBlur = 10;
        ctx.fillText("✨" + this.text, this.x, this.y + 24 + floatY); 
        ctx.shadowBlur = 0; 
    }
    update() { this.x -= gameSpeed; }
}

function handleObstacles() {
    if (frames % 100 === 0) obstacles.push(new Obstacle());
    for (let i = 0; i < obstacles.length; i++) {
        let obs = obstacles[i];
        obs.update(); obs.draw();
        
        if (player.x < obs.x + obs.w - 5 && player.x + player.w - 10 > obs.x && player.y < obs.y + obs.h - 5 && player.y + player.h - 10 > obs.y) {
            gameOver = true;
        }
        if (obs.x + obs.w < 0) { obstacles.splice(i, 1); score++; i--; }
    }
}

function handleRewards() {
    if (frames % 150 === 0) rewards.push(new Reward());
    for (let i = 0; i < rewards.length; i++) {
        let rw = rewards[i];
        rw.update(); rw.draw();
        
        if (player.x < rw.x + rw.w + 20 && player.x + player.w > rw.x && player.y < rw.y + rw.h && player.y + player.h > rw.y) {
            rewards.splice(i, 1);
            gold += 100; 
            i--; 
        } else if (rw.x + rw.w < 0) {
            rewards.splice(i, 1); i--; 
        }
    }
}

// 🌐 글로벌 랭킹 불러오기
async function loadRankings() {
    rankingList.innerHTML = '<li>서버에서 랭킹을 불러오는 중... ⏳</li>';
    try {
        const response = await fetch(SCRIPT_URL + '?action=get');
        const ranks = await response.json();
        
        rankingList.innerHTML = '';
        if (ranks.length === 0) {
            rankingList.innerHTML = '<li>아직 등록된 랭킹이 없습니다! 첫 번째로 도전하세요!</li>';
            return;
        }
        ranks.forEach((rank, index) => {
            rankingList.innerHTML += `<li><span>${index + 1}. ${rank.name}</span> <span>${rank.score}점 (${rank.gold}G)</span></li>`;
        });
    } catch (error) {
        rankingList.innerHTML = '<li>랭킹 서버와 연결할 수 없습니다. 😭</li>';
    }
}

// 🌐 글로벌 랭킹 등록하기
async function submitRanking() {
    let name = nicknameInput.value.trim();
    if (!name) name = '무명 극복자'; 
    
    const totalScore = score * 10 + gold; 
    const submitBtn = document.querySelector('.btn-submit');
    
    submitBtn.innerText = '등록 중...';
    submitBtn.disabled = true; // 중복 클릭 방지
    
    try {
        const url = `${SCRIPT_URL}?action=add&name=${encodeURIComponent(name)}&score=${score}&gold=${gold}&total=${totalScore}`;
        await fetch(url);
        
        nicknameInput.value = ''; 
        restartGame(); 
    } catch (error) {
        alert('랭킹 등록에 실패했습니다. 잠시 후 다시 시도해 주세요.');
    } finally {
        submitBtn.innerText = '랭킹 등록';
        submitBtn.disabled = false;
    }
}

function handleJump() {
    if (gameOver) return; 
    player.jump();
}

let spacePressed = false;
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32 || e.key === 'ArrowUp') {
        if (!gameOver) e.preventDefault(); 
        if (!spacePressed) { handleJump(); spacePressed = true; }
    }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32 || e.key === 'ArrowUp') spacePressed = false;
});
canvas.addEventListener('touchstart', (e) => {
    if (!gameOver) { e.preventDefault(); handleJump(); }
}, { passive: false });
canvas.addEventListener('mousedown', () => { if (!gameOver) handleJump(); });

function showGameOverUI() {
    ui.style.display = 'flex';
    scoreText.innerText = `극복 점수: ${score}점 / 획득 골드: ${gold}G`;
    loadRankings(); // 게임 오버 시 실시간 글로벌 랭킹 호출!
}

function restartGame() {
    ui.style.display = 'none';
    gameOver = false; score = 0; gold = 0; frames = 0; 
    obstacles.length = 0; rewards.length = 0; 
    player.y = canvas.height - player.h; player.vy = 0;
    canvas.focus(); 
    animate();
}

function animate() {
    if (gameOver) { showGameOverUI(); return; }
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    player.update();
    player.draw();
    handleObstacles();
    handleRewards(); 
    
    ctx.fillStyle = '#2f3542'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'left';
    ctx.fillText(`극복 점수: ${score}`, 20, 35);
    ctx.fillStyle = '#f39c12';
    ctx.fillText(`💰 골드: ${gold} G`, 20, 65);
    
    frames++;
    animationId = requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
